<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PashuSetu system architecture</title><desc id="desc">Farmer, dairy and wearable signals enter one secure pipeline for triage, clustering and district action.</desc>
<defs><style>.bg{fill:#f7f1e6}.card{fill:#fffdf8;stroke:#d9cdbb;stroke-width:2}.dark{fill:#231c13}.accent{fill:#a8431f}.sage{fill:#71834b}.gold{fill:#b98523}.h{font:700 30px Georgia,serif;fill:#231c13}.t{font:600 18px Arial,sans-serif;fill:#3b3227}.s{font:400 15px Arial,sans-serif;fill:#75695b}.w{fill:#fff}.line{fill:none;stroke:#b9aa96;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#a8431f;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrowA)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b9aa96"/></marker><marker id="arrowA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#a8431f"/></marker></defs>
<rect class="bg" width="1600" height="900"/><text x="80" y="72" class="h" font-size="38">PashuSetu — one pipeline, three early signals</text><text x="80" y="106" class="s">Offline-first · multilingual · explainable · district-scoped · veterinarian in control</text>
<!-- inputs --><rect class="card" x="70" y="170" rx="24" width="300" height="150"/><circle class="accent" cx="120" cy="220" r="22"/><text x="155" y="216" class="t">Farmer report</text><text x="155" y="244" class="s">App · offline · WhatsApp</text><text x="105" y="285" class="s">Symptoms · photo · location</text>
<rect class="card" x="70" y="375" rx="24" width="300" height="150"/><circle class="gold" cx="120" cy="425" r="22"/><text x="155" y="421" class="t">Dairy aggregate</text><text x="155" y="449" class="s">Village daily milk yield</text><text x="105" y="490" class="s">Weather-adjusted anomaly</text>
<rect class="card" x="70" y="580" rx="24" width="300" height="150"/><circle class="sage" cx="120" cy="630" r="22"/><text x="155" y="626" class="t">Farmer-owned sensor</text><text x="155" y="654" class="s">Collar · tag · milk line</text><text x="105" y="695" class="s">Private per-animal baseline</text>
<!-- pipeline --><rect class="dark" x="500" y="205" rx="30" width="390" height="500"/><text x="550" y="260" class="h w">Shared intelligence pipeline</text><rect x="545" y="305" width="300" height="75" rx="18" fill="#3b3126"/><text x="575" y="338" class="t w">1 · Validate + store</text><text x="575" y="363" class="s w">RLS, idempotency, audit trail</text><rect x="545" y="405" width="300" height="75" rx="18" fill="#3b3126"/><text x="575" y="438" class="t w">2 · Explainable triage</text><text x="575" y="463" class="s w">Top differential + reasons</text><rect x="545" y="505" width="300" height="75" rx="18" fill="#3b3126"/><text x="575" y="538" class="t w">3 · Detect shared pattern</text><text x="575" y="563" class="s w">Space · time · disease · herd</text><rect x="545" y="605" width="300" height="60" rx="18" fill="#a8431f"/><text x="575" y="642" class="t w">4 · Alert the right role</text>
<!-- outputs --><rect class="card" x="1020" y="205" rx="24" width="480" height="190"/><text x="1070" y="258" class="h">Farmer</text><text x="1070" y="298" class="t">Own herd status + immediate next step</text><text x="1070" y="330" class="s">Raw sensor details remain private</text><text x="1070" y="360" class="s">Can manually report visible symptoms anytime</text>
<rect class="card" x="1020" y="475" rx="24" width="480" height="230"/><text x="1070" y="528" class="h">District officer</text><text x="1070" y="568" class="t">Area alert only after a serious pattern</text><text x="1070" y="600" class="s">Risk map · case queue · cluster evidence</text><text x="1070" y="632" class="s">Confirm/reject → case → lab → contained</text><rect x="1070" y="656" rx="12" width="330" height="32" fill="#f3dfd6"/><text x="1088" y="678" class="s" fill="#8f3b20">Decision support — never auto-diagnosis</text>
<path class="line" d="M370 245H500"/><path class="line" d="M370 450H500"/><path class="line" d="M370 655H500"/><path class="line" d="M890 320H1020"/><path class="dash" d="M890 575H1020"/>
<rect x="70" y="800" width="1430" height="50" rx="16" fill="#ece5d7"/><text x="800" y="832" text-anchor="middle" class="t">Designed to feed NADRES / NADRS and link Bharat Pashudhan Tag IDs — not replace existing government systems</text>
</svg>